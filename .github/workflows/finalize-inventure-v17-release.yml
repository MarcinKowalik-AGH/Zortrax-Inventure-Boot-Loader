name: Finalize Inventure v1.7 release
on:
  push:
    paths:
      - .github/workflows/finalize-inventure-v17-release.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Publish and verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,hashlib,io,json,urllib.request,urllib.parse,zipfile,base64,time
          REPO="MarcinKowalik-AGH/Zortrax-Inventure-Boot-Loader"
          BASE="9f03c158ab88125a698a01c5ce8fdfdea14dd054"
          WF=".github/workflows/finalize-inventure-v17-release.yml"
          ID="1fKRr-B68Nbv9rZP0Mhllxx98q_i6g3lT"
          H="f3b3845e35661a53cb8c68bb861fddc3d16e4578901f34186f911ea3473bfafa"
          API="https://api.github.com/repos/"+REPO
          def must(t,s):
           if not t:raise RuntimeError(s)
          def sha(x):return hashlib.sha256(x).hexdigest()
          def blobsha(x):return hashlib.sha1(("blob %d\0"%len(x)).encode()+x).hexdigest()
          def req(url,obj=None,method=None,ctype="application/json"):
           if not url.startswith("https://"):url=API+url
           raw=None if obj is None else (obj if isinstance(obj,bytes) else json.dumps(obj).encode())
           headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"Inventure-v17-release","Content-Type":ctype}
           with urllib.request.urlopen(urllib.request.Request(url,data=raw,method=method,headers=headers),timeout=90) as response:
            data=response.read()
           return json.loads(data) if data else None
          def tree(ref):
           j=req("/git/trees/"+ref+"?recursive=1")
           must(not j.get("truncated"),"truncated repo tree")
           return {x["path"]:x for x in j["tree"] if x["type"]=="blob"}
          must(os.environ["GITHUB_REPOSITORY"]==REPO,"wrong repo")
          with urllib.request.urlopen("https://drive.usercontent.google.com/download?"+urllib.parse.urlencode({"id":ID,"export":"download","confirm":"t"}),timeout=90) as r:data=r.read(1000000)
          must(len(data)==330304 and sha(data)==H,"transfer hash mismatch")
          with zipfile.ZipFile(io.BytesIO(data)) as z:
           must(z.testzip() is None,"ZIP CRC")
           content={name:z.read(name) for name in z.namelist()}
          manifest=json.loads(content["firmware/v1.7/MANIFEST.json"])
          must(manifest["baud_menu"]==[115200,250000,500000,750000,1500000],"rate mismatch")
          head=req("/git/ref/heads/main")["object"]["sha"]
          must(head==os.environ["GITHUB_SHA"],"head changed")
          staging=req("/git/commits/"+head)
          must(staging["parents"][0]["sha"]==BASE,"unexpected staging parent")
          before=tree(head)
          must(WF in before,"workflow missing")
          baseline=tree(BASE)
          must(set(before)-set(baseline)=={WF},"other staged changes")
          for path,entry in baseline.items():must(before[path]["sha"]==entry["sha"],"baseline mismatch "+path)
          for name,val in content.items():must(before[name]["sha"]==blobsha(val),"mismatch "+name)
          checks=manifest["files"];must(len(checks)==3,"need 3 binaries")
          for name,row in checks.items():
           b=content["firmware/v1.7/"+name]
           must(row["size"]==len(b) and row["sha256"]==sha(b),"release asset hash mismatch")
          # Remove one-shot workflow first, to ensure tag points to clean tree.
          t=req("/git/trees",{"base_tree":staging["tree"]["sha"],"tree":[{"path":WF,"mode":"100644","type":"blob","sha":None}]},"POST")["sha"]
          c=req("/git/commits",{"message":"chore: finalize Inventure 1.7 publication and clean temporary workflow","tree":t,"parents":[head]},"POST")["sha"]
          req("/git/refs/heads/main",{"sha":c,"force":False},"PATCH")
          after=tree(c)
          must(WF not in after and len(after)==len(baseline),"final tree has extra files")
          for k,v in baseline.items():must(after[k]["sha"]==v["sha"],"content changed "+k)
          notes="# Inventure boot v1.7 FINAL — RELEASE 1.7\n\nFive UART rates, in order: **115200, 250000, 500000, 750000, 1500000**. Default **250000 / UART on bootwait OFF**.\n\nThree separately verified firmware distributions: UPGRADE (custom boot), FROM FACTORY V9, and ST-LINK (32 KiB at 0x08000000). SHA256SUMS accompanies them. Restore APP separately after either SD installer; the provided RESTORE.BIN is Zortrax 1.6.1/r0323, NOT Klipper.\n\nThis exact 1.7 firmware is **not yet physically tested**. Target is Inventure V9 / STM32F207 only; previous v1.5-HW2 was hardware-tested. Do not mix M300 firmware or change Option Bytes to bypass refusals.\n\n[Polska instrukcja](https://github.com/"+REPO+"/blob/main/docs/v1.7/INSTALACJA_PL.md) | [English guide](https://github.com/"+REPO+"/blob/main/docs/v1.7/INSTALLATION_EN.md) | [v1.5 archive](https://github.com/"+REPO+"/tree/main/docs/v1.5) | [v1.4 archive](https://github.com/"+REPO+"/tree/main/docs/v1.4)"
          release=req("/releases",{"tag_name":"v1.7","target_commitish":c,"name":"Inventure boot v1.7 FINAL — RELEASE 1.7","body":notes,"draft":True,"prerelease":False},"POST")
          out=[]
          for name in list(checks)+["SHA256SUMS.txt"]:
           b=content["firmware/v1.7/"+name]
           url=release["upload_url"].split("{")[0]+"?"+urllib.parse.urlencode({"name":name})
           item=req(url,b,"POST","application/zip" if name.endswith(".zip") else "application/octet-stream" if name.endswith(".bin") else "text/plain")
           must(item["size"]==len(b) and (not item.get("digest") or item["digest"]=="sha256:"+sha(b)),"uploaded checksum error")
           out.append(item)
          release=req("/releases/"+str(release["id"]),{"draft":False,"prerelease":False,"make_latest":"true"},"PATCH")
          must(not release["draft"] and not release["prerelease"],"release not public")
          for item in out:
           for i in range(4):
            try:
             with urllib.request.urlopen(item["browser_download_url"],timeout=70) as r:received=r.read(1000000)
             break
            except Exception:
             if i==3:raise
             time.sleep(2)
           must(received==content["firmware/v1.7/"+item["name"]],"anonymous readback incorrect")
          result={"status":"PASS_PUBLIC","release":release["html_url"],"commit":c,"assets":[{"name":x["name"],"size":x["size"]} for x in out],"historical_blobs_unchanged":True,"anonymous_download_verified":True}
          print(json.dumps(result,indent=2),flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write("## Inventure v1.7 FINAL\n\n"+json.dumps(result,indent=2))
          PY
