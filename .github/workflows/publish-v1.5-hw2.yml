name: Publish owner-tested Inventure v1.5 HW2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1.5-hw2.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-inventure-v1.5-hw2
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'MarcinKowalik-AGH/Zortrax-Inventure-Boot-Loader' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate public bundle, preserve archive, publish exact tested bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, posixpath, re, urllib.error, urllib.parse, urllib.request, zipfile
          REPO = 'MarcinKowalik-AGH/Zortrax-Inventure-Boot-Loader'
          BASE = '272dc5f5bd2732c0360180fe7079df3b258c06a7'
          WORKFLOW = '.github/workflows/publish-v1.5-hw2.yml'
          BUNDLE_SHA = '8a558759c505408d2cedea14f924c3e140c5424d83b4af8d282577ce75190b4f'
          BUNDLE_BYTES = 416652
          DRIVE_ID = '1JZAMhZXLZxS-6AAIw-SjX5InLsvOqyRt'
          API = 'https://api.github.com/repos/' + REPO
          STEM = 'Inventure_boot_v1.5_HW2_STOCK_FONT_2026-10-29'
          FIRMWARE = {
            STEM + '_SD_UPGRADE.zip': ('85640a127cd16fab1b24a8b8f69d3bf6c251865ab81df5223180a1ea8a209b85', 140406),
            STEM + '_SD_FACTORY_V9.zip': ('3967bc324adfea5cfd374a5fbd1066877acece59f0f2d65be02fffd6326856e0', 154971),
            STEM + '_STLINK_32KiB_0x08000000.bin': ('2d15e63a3db37bafb1f36d386d59b11c0d3d19f4d561b460b87e5201ab09b933', 32768),
          }
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          def blobsha(data):
              return hashlib.sha1(('blob %d\0' % len(data)).encode() + data).hexdigest()
          def api(path, data=None, method=None, raw=False, content_type='application/json'):
              url = path if path.startswith('https://') else API + path
              require(urllib.parse.urlsplit(url).hostname in ('api.github.com', 'uploads.github.com'), 'Unexpected API host')
              payload = data if raw else (json.dumps(data).encode() if data is not None else None)
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'Inventure-publication', 'Content-Type': content_type}
              request = urllib.request.Request(url, data=payload, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=90) as response:
                  body = response.read()
              return json.loads(body) if body else None
          def get_optional(path):
              try:
                  return api(path)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return None
                  raise
          def tree(ref):
              result = api('/git/trees/' + ref + '?recursive=1')
              require(not result.get('truncated'), 'Truncated Git tree')
              return {entry['path']: entry for entry in result['tree'] if entry['type'] == 'blob'}
          require(os.environ.get('GITHUB_REPOSITORY') == REPO, 'Wrong repository')
          public_url = 'https://drive.usercontent.google.com/download?' + urllib.parse.urlencode({'id': DRIVE_ID, 'export': 'download', 'confirm': 't'})
          with urllib.request.urlopen(urllib.request.Request(public_url, headers={'User-Agent': 'Inventure-publication'}), timeout=90) as response:
              archive_bytes = response.read(2 * 1024 * 1024)
          require(len(archive_bytes) == BUNDLE_BYTES and sha(archive_bytes) == BUNDLE_SHA, 'Public bundle length/SHA mismatch; no repository files changed')
          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              require(archive.testzip() is None, 'Bundle CRC failure')
              names = archive.namelist()
              require(len(names) == 29 and len(set(names)) == 29, 'Unexpected bundle member count')
              require(sum(item.file_size for item in archive.infolist()) < 2 * 1024 * 1024, 'Unexpected expanded size')
              contents = {}
              for name in names:
                  require(name == posixpath.normpath(name) and not name.startswith('/') and '..' not in name.split('/'), 'Unsafe path')
                  allowed = name == 'README.md' or (name.startswith('docs/v1.5/') and name.endswith(('.md', '.json'))) or (name.startswith('docs/images/v1.5/') and name.endswith('.png')) or (name.startswith('firmware/v1.5/') and name.split('/')[-1] in set(FIRMWARE) | {'SHA256SUMS.txt'})
                  require(allowed, 'Unexpected public file: ' + name)
                  contents[name] = archive.read(name)
          for name, (digest, size) in FIRMWARE.items():
              data = contents['firmware/v1.5/' + name]
              require(len(data) == size and sha(data) == digest, 'Firmware identity mismatch: ' + name)
          boot = contents['firmware/v1.5/' + STEM + '_STLINK_32KiB_0x08000000.bin']
          require(boot[0x7f00:] == b'\xff' * 256, 'P4 journal is not canonical')
          restore = None
          for kind, installer in [('SD_UPGRADE', 'INVENTUR.IVB'), ('SD_FACTORY_V9', 'InventureUpdate.bin')]:
              with zipfile.ZipFile(io.BytesIO(contents['firmware/v1.5/' + STEM + '_' + kind + '.zip'])) as package:
                  require(set(package.namelist()) == {installer, 'RESTORE.BIN', 'ZBACKUP.BIN', 'ZBACK2.BIN'} and package.testzip() is None, 'Bad SD package')
                  image = package.read(installer)
                  stock = package.read('RESTORE.BIN')
                  require(len(stock) == 164864 and sha(stock) == '1368bdbddad941a8f7c025715946662a34d3def442d0d3c00af4315b54c8ba17', 'Wrong RESTORE')
                  for slot in ('ZBACKUP.BIN', 'ZBACK2.BIN'):
                      require(package.read(slot) == b'\xa5' * 32768, 'Bad backup template')
                  if installer == 'INVENTUR.IVB':
                      require(image[:8] == b'INVB001\0' and sha(image[64:]) == image[32:64].hex(), 'Bad IVB digest')
                      require(image[64:].count(boot) == 1, 'Embedded BOOT differs from ST-Link image')
                  else:
                      require(image[:8] == b'ZRTXUINV', 'Bad factory envelope')
          checks = json.loads(contents['docs/v1.5/PUBLICATION_CHECKS.json'])
          require(checks['hardware_feedback']['permanent_boot_hardware_reads_actual_printer_data'] is True, 'Owner Hardware confirmation missing')
          baseline = tree(BASE)
          head = api('/git/ref/heads/main')['object']['sha']
          before = tree(head)
          for path, entry in baseline.items():
              if path != 'README.md':
                  require(path in before and before[path]['sha'] == entry['sha'], 'Baseline changed: ' + path)
          matches = all(path in before and before[path]['sha'] == blobsha(data) for path, data in contents.items())
          if not matches:
              require(head == os.environ['GITHUB_SHA'], 'Concurrent branch update; refusing overwrite')
              commit_info = api('/git/commits/' + head)
              require(len(commit_info['parents']) == 1 and commit_info['parents'][0]['sha'] == BASE, 'Unexpected publication parent')
              require(set(before) - set(baseline) == {WORKFLOW}, 'Unexpected staging files')
              require(before['README.md']['sha'] == baseline['README.md']['sha'], 'README changed before publication')
              entries = []
              for path, data in contents.items():
                  result = api('/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'}, 'POST')
                  require(result['sha'] == blobsha(data), 'Uploaded blob mismatch')
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': result['sha']})
              entries.append({'path': WORKFLOW, 'mode': '100644', 'type': 'blob', 'sha': None})
              new_tree = api('/git/trees', {'base_tree': commit_info['tree']['sha'], 'tree': entries}, 'POST')['sha']
              final_commit = api('/git/commits', {'message': 'release: Inventure v1.5 HW2, real Hardware readout confirmed on printer\n\nPublish three unchanged tested binaries, PL/EN manuals and native previews; retain all v1.4 artifacts and public host tools. No private sources or unique printer data.', 'tree': new_tree, 'parents': [head]}, 'POST')['sha']
              print('Prepared publication commit:', final_commit, flush=True)
              require(api('/git/ref/heads/main')['object']['sha'] == head, 'Concurrent head change')
              api('/git/refs/heads/main', {'sha': final_commit, 'force': False}, 'PATCH')
          else:
              final_commit = head
          after = tree(final_commit)
          require(WORKFLOW not in after, 'Temporary workflow remains in release tree')
          require(len(after) == len(baseline) - 1 + len(contents), 'Unexpected final file count')
          for path, entry in baseline.items():
              if path != 'README.md':
                  require(after[path]['sha'] == entry['sha'], 'Archive/tool changed: ' + path)
          for path, data in contents.items():
              require(after[path]['sha'] == blobsha(data), 'Published content mismatch: ' + path)
          link_count = 0
          for path, data in contents.items():
              if not path.endswith('.md'):
                  continue
              for dest in re.findall(r'\]\(([^)]+)\)', data.decode()):
                  if re.match(r'(https?://|mailto:|#)', dest):
                      continue
                  target = posixpath.normpath(posixpath.join(posixpath.dirname(path), dest.split('#')[0])).rstrip('/')
                  require(target in after or any(item.startswith(target + '/') for item in after), 'Broken link: ' + path + ' -> ' + target)
                  link_count += 1
          release = get_optional('/releases/tags/v1.5')
          if release is None:
              drafts = api('/releases?per_page=100')
              candidates = [item for item in drafts if item['tag_name'] == 'v1.5']
              require(len(candidates) <= 1, 'Multiple v1.5 drafts')
              release = candidates[0] if candidates else None
          notes = contents['docs/v1.5/RELEASE_NOTES.md'].decode() + '\n\n[Polska instrukcja](https://github.com/' + REPO + '/blob/v1.5/docs/v1.5/INSTALACJA_PL.md) · [English manual](https://github.com/' + REPO + '/blob/v1.5/docs/v1.5/INSTALLATION_EN.md) · [Retained v1.4](https://github.com/' + REPO + '/tree/v1.5/firmware/v1.4)\n'
          if release is None:
              release = api('/releases', {'tag_name': 'v1.5', 'target_commitish': final_commit, 'name': 'Inventure boot v1.5 — RELEASE 1.5-HW2', 'body': notes, 'draft': True, 'prerelease': False}, 'POST')
          else:
              require(release['target_commitish'] == final_commit, 'Existing release targets another commit')
          wanted_assets = list(FIRMWARE) + ['SHA256SUMS.txt']
          assets = api('/releases/' + str(release['id']) + '/assets?per_page=100')
          require(all(item['name'] in wanted_assets for item in assets), 'Unexpected pre-existing release asset')
          asset_map = {item['name']: item for item in assets}
          for name in wanted_assets:
              data = contents['firmware/v1.5/' + name]
              if name in asset_map:
                  item = asset_map[name]
                  require(item['size'] == len(data) and item.get('digest') == 'sha256:' + sha(data), 'Existing asset differs')
                  continue
              require(release['draft'], 'Missing asset in already-public release')
              upload_url = release['upload_url'].split('{')[0] + '?' + urllib.parse.urlencode({'name': name})
              item = api(upload_url, data, 'POST', raw=True, content_type='application/zip' if name.endswith('.zip') else 'text/plain' if name.endswith('.txt') else 'application/octet-stream')
              require(item['size'] == len(data), 'Release asset size mismatch')
              if item.get('digest'):
                  require(item['digest'] == 'sha256:' + sha(data), 'Release asset digest mismatch')
          if release['draft']:
              release = api('/releases/' + str(release['id']), {'draft': False, 'prerelease': False, 'make_latest': 'true'}, 'PATCH')
          assets = api('/releases/' + str(release['id']) + '/assets?per_page=100')
          require(set(item['name'] for item in assets) == set(wanted_assets), 'Final asset set mismatch')
          for item in assets:
              with urllib.request.urlopen(item['browser_download_url'], timeout=90) as response:
                  got = response.read(1024 * 1024)
              expected = contents['firmware/v1.5/' + item['name']]
              require(got == expected, 'Anonymous release download differs: ' + item['name'])
          report = {'status': 'PASS_PUBLICATION', 'commit': final_commit, 'release_url': release['html_url'], 'files': len(after), 'retained_baseline_files': len(baseline) - 1, 'new_or_updated_public_files': len(contents), 'relative_links_checked': link_count, 'hardware_readout_confirmed_on_printer': True, 'release_assets': [{'name': item['name'], 'bytes': item['size'], 'url': item['browser_download_url']} for item in assets]}
          print(json.dumps(report, indent=2, ensure_ascii=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Inventure v1.5-HW2 publication\n\n```json\n' + json.dumps(report, indent=2, ensure_ascii=False) + '\n```\n')
          PY
